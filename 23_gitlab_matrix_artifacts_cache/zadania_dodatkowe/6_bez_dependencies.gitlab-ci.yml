stages:
  - zadanie1
  - zadanie2

zadanie1:
  image: alpine
  stage: zadanie1
  script:
    - echo "Testowanie GitLab CI/CD"
    - ls -la
    - mkdir mojezadania
    - cd mojezadania
    - echo "Testujemy GitLab CI/CD" > mojplik.txt
    - cat mojplik.txt
  artifacts:
    paths:
      - mojezadania/

zadanie1bis:
  image: alpine
  stage: zadanie1
  script:
    - echo "Testowanie GitLab CI/CD"
    - ls -la
    - mkdir mojezadania
    - cd mojezadania
    - echo "Zadanie1bis" > mojplikbis.txt
    - cat mojplikbis.txt
  artifacts:
    paths:
      - mojezadania/

zadanie2:
  image: alpine
  stage: zadanie2
  script:
    - ls mojezadania/

zadanie_bez_czekania:
  image: alpine
  stage: zadanie2
  needs: []
  script:
    - ls mojezadania/ || echo "Brak katalogu mojezadania"
