testy_warunku:
  image: ubuntu:24.04
  stage: test
  script:
    - echo "Pierwsze zadanie"
    - exit 1
  allow_failure: true

drugie_zadanie_po_awarii:
  image: ubuntu:24.04
  stage: deploy
  needs:
    - testy_warunku
  script:
    - echo "Drugie zadanie wykonane po awarii"
  when: on_failure

uruchom_po_sukcesie:
  image: ubuntu:24.04
  stage: deploy
  needs:
    - testy_warunku
  script:
    - echo "Po sukcesie"
  when: on_success
