workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^releases\/.*/
    - if: $CI_COMMIT_TAG =~ /^v1\..*/
    - changes:
        - "**/*.js"

filtr:
  image: ubuntu:24.04
  script:
    - echo "Galaz $CI_COMMIT_BRANCH, znacznik $CI_COMMIT_TAG, zrodlo $CI_PIPELINE_SOURCE"
